name: Release

# Pushing a version tag (e.g. v1.0.0) builds the plugin and publishes a release with pumpkinspice.wps
# attached on its own. GitHub adds the source code archives to every release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: build binary
      run: |
        docker build . -t builder
        docker run --rm -v ${PWD}:/project builder make
    - name: Create Release
      uses: "softprops/action-gh-release@v2"
      with:
        tag_name: ${{ github.ref_name }}
        name: PumpkinSpice ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          ./pumpkinspice.wps
